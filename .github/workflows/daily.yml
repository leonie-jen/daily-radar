name: 每日更新

on:
  schedule:
    # 台北時間每天早上 8:00（UTC 00:00）跑一次。
    # 註：GitHub 的排程常會延遲 5~30 分鐘，這是官方已知行為，不是壞掉。
    - cron: '0 0 * * *'
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下就跑

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 跑爬蟲
        env:
          # 沒設這個 secret 也能跑，只是不會有 AI 摘要
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scrapers.run_all

      - name: 把結果 commit 回 repo
        run: |
          git config user.name  "daily-radar bot"
          git config user.email "action@github.com"
          git add data
          git diff --staged --quiet || git commit -m "資料更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: 組出要發布的網站（site/ + data/）
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
