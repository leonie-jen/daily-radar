name: 記錄刷題

# 開一張 leetcode 標籤的 issue，內容就會被寫進 data/leetcode.json 然後自動關閉。
# 這樣手機上不用裝任何東西，開 GitHub 網頁填表單就好。
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  record:
    if: contains(github.event.issue.labels.*.name, 'leetcode')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 解析 issue 並寫入
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: python tools/log_leetcode.py

      - run: |
          git config user.name  "daily-radar bot"
          git config user.email "action@github.com"
          git add data/leetcode.json
          git diff --staged --quiet || git commit -m "刷題紀錄 #${{ github.event.issue.number }}"
          git push

      - name: 關閉 issue
        run: gh issue close "$NUM" --comment "已記錄到網站 ✅"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
