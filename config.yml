# ============================================================
# daily-radar 設定檔 — 你平常只需要改這個檔案
# 改完 push 上去，隔天早上 GitHub Actions 就會照新設定抓
# ============================================================

ai:
  # 有設 ANTHROPIC_API_KEY 才會啟用；沒有的話自動降級成純關鍵字過濾
  enabled: true
  model: claude-haiku-4-5      # 便宜的模型，每天約 NT$0.3~1
  max_items_per_run: 40        # 每次最多送幾篇去摘要（成本上限）
  language: 繁體中文

# ------------------------------------------------------------
# 1. GT OMSCS 情報
# ------------------------------------------------------------
omscs:
  enabled: true
  # 這些字出現在標題/內文時，會被標記為「錄取情報」高優先
  admission_keywords:
    - admitted
    - accepted
    - rejected
    - denied
    - decision
    - admission
    - acceptance rate
    - profile
    - waitlist
    - application
    - 錄取
    - 被拒
  extra_feeds: []   # 想加的 RSS 自己貼在這

# ------------------------------------------------------------
# 2. 美國學校 CPT / OPT / 簽證風向
# ------------------------------------------------------------
cpt:
  enabled: true
  queries:
    - '"day 1 CPT"'
    - '"CPT" SEVP university'
    - 'F-1 visa CPT crackdown'
    - 'OPT STEM extension rule'
    - 'international student work authorization'

# ------------------------------------------------------------
# 3. 職缺 + 技術文章（自動化測試 / QA）
# ------------------------------------------------------------
jobs:
  enabled: true
  keywords:                    # 職缺關鍵字
    - 自動化測試
    - QA Engineer
    - SDET
    - Playwright
  linkedin_keywords: "Test Automation"
  linkedin_location: "Taiwan"
  # 每天追蹤這些部落格的新文章（來自你 learning-cs/定期看/好部落格.md）
  blog_feeds:
    - https://www.hwchiu.com/rss.xml
    - https://columns.chicken-house.net/feed.xml
    - https://www.cnblogs.com/longronglang/rss
  article_queries:             # 另外用 Google News 撈文章
    - Playwright 自動化測試
    - test automation best practices

# ------------------------------------------------------------
# 4. 投資導航（分類連結）+ 匯率股市摘要
#    這一頁主要是「快速前往各大網站」，上面那條匯率/指數只是順手看一眼
# ------------------------------------------------------------
finance:
  enabled: true
  usd_twd_alert_below: 30.5     # 美金低於這個價就標紅
  tickers:                      # 頁面頂端那條摘要要顯示什麼
    - { symbol: "^TWII",  name: 台股加權 }
    - { symbol: "^GSPC",  name: S&P 500 }
    - { symbol: "^IXIC",  name: 那斯達克 }
    - { symbol: "^SOX",   name: 費半 }
    - { symbol: "2330.TW", name: 台積電 }
    - { symbol: "NVDA",   name: NVIDIA }

  harrymemo:                    # 哈利的每日盤後報告（最新兩期是付費會員限定）
    enabled: true
    sections: [us, tw, crypto]
    days_back: 3

  # ---- 導航連結：想加就往下貼，網站會自動多一張卡 ----
  links:
    - category: 每日必看
      sites:
        - { name: 哈利的投資研究筆記庫, url: "https://harrymemo.com/", note: 台股美股每日盤後 Dashboard }
        - { name: 財經M平方 MacroMicro, url: "https://www.macromicro.me/", note: 總經數據圖表 }
        - { name: TradingView, url: "https://www.tradingview.com/chart/", note: 看線圖 }
        - { name: Finviz Map, url: "https://finviz.com/map.ashx", note: 美股熱力圖一眼看完 }

    - category: 台股
      sites:
        - { name: 證交所 基本市況報導, url: "https://mis.twse.com.tw/stock/", note: 官方即時 }
        - { name: Goodinfo 台灣股市資訊網, url: "https://goodinfo.tw/tw/index.asp", note: 個股基本面 }
        - { name: 神秘金字塔 籌碼, url: "https://norway.twsthr.info/StockHolders.aspx", note: 大戶持股 }
        - { name: 公開資訊觀測站, url: "https://mops.twse.com.tw/mops/web/index", note: 財報與重大訊息 }
        - { name: CMoney 選股, url: "https://www.cmoney.tw/finance/", note: "" }

    - category: 美股
      sites:
        - { name: Yahoo Finance, url: "https://finance.yahoo.com/", note: 綜合報價 }
        - { name: StockAnalysis, url: "https://stockanalysis.com/", note: 乾淨的財報數據 }
        - { name: Koyfin, url: "https://app.koyfin.com/", note: 免費版就很夠用 }
        - { name: Earnings Whispers, url: "https://www.earningswhispers.com/calendar", note: 財報行事曆 }
        - { name: SEC EDGAR, url: "https://www.sec.gov/edgar/searchedgar/companysearch", note: 原始申報文件 }

    - category: 半導體 · 產業研究
      sites:
        - { name: SemiAnalysis, url: "https://semianalysis.com/", note: 半導體深度分析 }
        - { name: TrendForce 集邦, url: "https://www.trendforce.com.tw/", note: 記憶體/面板/晶圓報價 }
        - { name: DIGITIMES, url: "https://www.digitimes.com.tw/", note: 供應鏈消息 }
        - { name: 台積電法說會, url: "https://investor.tsmc.com/chinese/quarterly-results", note: 每季一定要看 }
        - { name: Stratechery, url: "https://stratechery.com/", note: 科技產業策略 }

    - category: Web3 · 加密貨幣
      sites:
        - { name: CoinGecko, url: "https://www.coingecko.com/zh-tw", note: 幣價與市值 }
        - { name: DefiLlama, url: "https://defillama.com/", note: DeFi TVL }
        - { name: Dune, url: "https://dune.com/browse/dashboards", note: 鏈上數據儀表板 }
        - { name: The Block, url: "https://www.theblock.co/data", note: 產業數據 }
        - { name: Etherscan, url: "https://etherscan.io/", note: 以太坊瀏覽器 }

    - category: 美債 · 利率
      sites:
        - { name: FRED 聯準會經濟數據, url: "https://fred.stlouisfed.org/", note: 所有總經數據的源頭 }
        - { name: 美債殖利率曲線, url: "https://www.ustreasuryyieldcurve.com/", note: 倒掛看這裡 }
        - { name: CME FedWatch, url: "https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html", note: 市場預期的升降息機率 }
        - { name: 美國財政部 每日利率, url: "https://home.treasury.gov/interest-rates-data-csv-archive", note: 官方原始資料 }

    - category: 黃金 · 原物料
      sites:
        - { name: 台銀黃金存摺, url: "https://rate.bot.com.tw/gold", note: 台幣計價金價 }
        - { name: Kitco, url: "https://www.kitco.com/", note: 國際金銀價 }
        - { name: Trading Economics 商品, url: "https://tradingeconomics.com/commodities", note: 原油銅小麥一次看 }

    - category: 匯率 · 換匯
      sites:
        - { name: 台銀牌告匯率, url: "https://rate.bot.com.tw/xrt?Lang=zh-TW", note: 實際換匯就看這個 }
        - { name: 各銀行匯率比較, url: "https://www.findrate.tw/USD/", note: 找最好的價 }
        - { name: Wise, url: "https://wise.com/tw/currency-converter/", note: 跨國匯款 }
        - { name: XE, url: "https://www.xe.com/currencyconverter/", note: 國際中間價 }

# ------------------------------------------------------------
# 5. 商品降價追蹤
# ------------------------------------------------------------
prices:
  enabled: true
  # target_price: 低於這個價格就在網站上標「該買了」
  # 先放兩筆範例，換成你真正要追的網址就好
  watch:
    # 下面兩筆是可以跑的範例，換成你真正想追的網址即可
    - name: 電子鋼琴 DP200（88 鍵重鎚）
      url: https://24h.pchome.com.tw/prod/QBAD09-A9009MEOM
      target_price: 12000
    - name: Bora BX-20 折疊電鋼琴
      url: https://www.momoshop.com.tw/goods/GoodsDetail.jsp?i_code=9442657
      target_price: 3000
    - name: 決勝領思 5500 單字
      url: https://www.books.com.tw/products/0010948943
      target_price: 550

# ------------------------------------------------------------
# 6. 刷題紀錄（手動）
# ------------------------------------------------------------
leetcode:
  enabled: true
  mode: manual                 # 用 GitHub Issue 表單記錄，手機也能填
  weekly_goal: 10              # 一週目標題數，網站會顯示進度條

# ------------------------------------------------------------
# 7. 習慣打卡
#    改這裡就能增減習慣；emoji 只是網站上好認而已
# ------------------------------------------------------------
habits:
  enabled: true
  track:
    - { key: 運動,      emoji: "🏃", goal_per_week: 4 }
    - { key: VoiceTube, emoji: "🎧", goal_per_week: 7 }
    - { key: 韓文,      emoji: "🇰🇷", goal_per_week: 7 }
    - { key: 研究所,    emoji: "🎓", goal_per_week: 5 }
